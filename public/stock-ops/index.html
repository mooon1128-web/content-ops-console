<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>馒头猫 · 经营协作台</title><link rel="stylesheet" href="/stock-ops/styles.css"></head>
<body>
<div id="login" class="login" hidden><form id="login-form"><span class="brand-icon">馒</span><p class="eyebrow">PUPUHOME · TEAM WORKSPACE</p><h1>经营协作台</h1><p>使用内容运营管理台的个人账号登录。</p><label>登录名<input name="username" required autocomplete="username"></label><label>密码<input name="password" required type="password" autocomplete="current-password"></label><button class="primary">登录协作台</button><p id="login-message" role="alert"></p></form></div>
<div id="workspace" hidden>
<aside class="sidebar"><a class="brand" href="/stock-ops/"><span class="brand-icon">馒</span><span>馒头猫<small>经营协作台</small></span></a><p class="nav-caption">一起把每一件记清楚</p><nav id="nav"></nav><div class="side-bottom"><a href="/xhs-media/" target="_blank" rel="noopener">↗ 博主推广系统</a><a href="/" target="_blank" rel="noopener">↗ 内容运营管理台</a><div id="identity"></div><button id="logout" class="text-button">退出登录</button></div></aside>
<main><header class="topbar"><span id="breadcrumb">经营总览</span><div><span id="sync-status">正在读取</span><button id="refresh">↻ 刷新</button><button id="backup">导出备份</button></div></header><div id="notice" role="status" hidden></div><section id="content"></section><footer>月销售用于分析 · 库存以实物、预留及出入库流水核对 · 未知数据保留为空</footer></main>
</div>
<dialog id="editor"><form id="editor-form"><div class="dialog-head"><div><p class="eyebrow">PUPUHOME / RECORD</p><h2 id="editor-title"></h2></div><button type="button" id="close-editor" aria-label="关闭">×</button></div><p id="editor-hint" class="hint"></p><div id="editor-fields" class="form-grid"></div><p id="form-message" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel-editor">取消</button><button class="primary" id="save-editor">保存记录</button></div></form></dialog>
<script type="module" src="/stock-ops/app.js"></script></body></html>
